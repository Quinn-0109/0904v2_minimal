footprint: [[0.35, 0.22], [0.35, -0.22], [-0.35, -0.22], [-0.35, 0.22]]
footprint_padding: 0.03
transform_tolerance: 0.5
map_type: costmap

static_layer:
  enabled: true
  map_topic: /simenv/first_floor_map
  subscribe_to_updates: false
  track_unknown_space: true
  use_maximum: false
  trinary_costmap: true

obstacle_layer:
  enabled: true
  observation_sources: local_points
  local_points:
    data_type: PointCloud2
    topic: /simenv/local_obstacles
    sensor_frame: base
    marking: true
    clearing: true
    min_obstacle_height: -0.05
    max_obstacle_height: 1.10
    obstacle_range: 8.0
    raytrace_range: 9.0
    expected_update_rate: 0.0
  combination_method: 1

inflation_layer:
  enabled: true
  inflation_radius: 0.45
  cost_scaling_factor: 5.0
